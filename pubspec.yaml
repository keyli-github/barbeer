name: barbeer
description: "BarBeer - Sistema de gestion para restobares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.1
  uuid: ^4.5.1
  cached_network_image: ^3.3.1
  file_picker: ^10.3.2
  http_parser: ^4.1.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/yacare.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/yacare.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
